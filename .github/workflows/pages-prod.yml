name: Deploy production site

# Publishes the full site (including the ~68 MB sprite atlas) to the root of the
# `gh-pages` branch. PR previews live under `pr-preview/` on the same branch and
# reuse this deploy's atlas, so they don't ship their own copy.

on:
  push:
    branches:
      - master
  workflow_dispatch: {}

# Serialize every push to gh-pages (this workflow + the PR-preview one) so they
# never race on the same branch.
concurrency:
  group: gh-pages-deploy
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm install --legacy-peer-deps

      - run: npm run build:website
        env:
          PUBLIC_BASE: /factorio-blueprint-editor/
          # Firebase web config for the blueprint library's cloud sync (Phase 6).
          # These are GitHub repo *variables*, not secrets — Firebase web config is
          # public by design (it ships in the client bundle). If they're unset they
          # resolve to empty ⇒ the build is "unconfigured" ⇒ a local-only build with
          # no sign-in UI. See packages/website/src/library/firebase.ts.
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}

      - name: Deploy to gh-pages root
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: packages/website/dist
          # don't wipe the PR previews that live alongside the root site
          clean-exclude: pr-preview
