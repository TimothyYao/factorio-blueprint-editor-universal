name: Deploy production site

# Publishes the site to the root of the `gh-pages` branch. The build is small —
# app code only: the per-pack data.json + sprite atlases are served by the
# dedicated data plane (`TimothyYao/factorio-pack-data`), which this deploy points
# at via VITE_DATA_URL. PR previews live under `pr-preview/` on the same branch
# and point at the same data plane.
#
# This fork's project-site URL is
# https://timothyyao.github.io/factorio-blueprint-editor-universal/
# (PUBLIC_BASE = /<repo>/). Enabling Pages itself is a repo setting — see
# docs/github-pages.md.

on:
  push:
    branches:
      - master
  workflow_dispatch: {}

# Serialize every push to gh-pages (this workflow + the PR-preview one) so they
# never race on the same branch.
concurrency:
  group: gh-pages-deploy
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - run: npm install --legacy-peer-deps

      - run: npm run build:website
        env:
          # Project-site path is /<repo>/ — this fork's repo is
          # factorio-blueprint-editor-universal, not the parent's
          # factorio-blueprint-editor. See docs/github-pages.md.
          PUBLIC_BASE: /${{ github.event.repository.name }}/
          # Pack data (per-pack data.json + *.basis atlas + packs.json manifest)
          # comes from the dedicated data plane, not from this repo — nothing
          # game-derived is committed here or baked into dist/. GitHub Pages
          # serves it with `Access-Control-Allow-Origin: *`, so the editor's
          # cross-origin fetches need no proxy. See
          # https://github.com/TimothyYao/factorio-pack-data.
          VITE_DATA_URL: https://timothyyao.github.io/factorio-pack-data
          # Firebase web config for the blueprint library's cloud sync (Phase 6).
          # These are GitHub repo *variables*, not secrets — Firebase web config is
          # public by design (it ships in the client bundle). If they're unset they
          # resolve to empty ⇒ the build is "unconfigured" ⇒ a local-only build with
          # no sign-in UI. See packages/website/src/library/firebase.ts.
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}

      - name: Deploy to gh-pages root
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          folder: packages/website/dist
          # don't wipe the PR previews that live alongside the root site
          clean-exclude: pr-preview
