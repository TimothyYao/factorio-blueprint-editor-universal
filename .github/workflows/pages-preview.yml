name: PR preview

# Builds a slim per-PR preview (no atlas — it reuses the production deploy's via
# VITE_DATA_URL) and publishes it to `pr-preview/pr-<N>/` on the `gh-pages`
# branch, then comments the URL on the PR. On close, the preview is removed.

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

concurrency:
  group: gh-pages-deploy
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        if: github.event.action != 'closed'
        with:
          node-version: 22

      - run: npm install --legacy-peer-deps
        if: github.event.action != 'closed'

      - run: npm run build:website
        if: github.event.action != 'closed'
        env:
          PUBLIC_BASE: /factorio-blueprint-editor/pr-preview/pr-${{ github.event.number }}/
          # Reuse the production deploy's per-pack atlas instead of bundling our
          # own (~70 MB/pack) copy. Production is now pack-aware — it serves
          # data/<pack>/data.json + atlas — and the editor appends the active
          # pack id to this root at runtime, so a preview fetches
          # /factorio-blueprint-editor/data/<pack>/data.json from the prod deploy.
          VITE_DATA_URL: /factorio-blueprint-editor/data
          SKIP_DATA_COPY: 'true'
          # Firebase web config for the blueprint library's cloud sync (Phase 6).
          # GitHub repo *variables*, not secrets — Firebase web config is public
          # (it ships in the client bundle). Unset ⇒ empty ⇒ unconfigured ⇒ a
          # local-only preview with no sign-in UI. See
          # packages/website/src/library/firebase.ts.
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}

      - name: Deploy / remove preview
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: packages/website/dist
          umbrella-dir: pr-preview
