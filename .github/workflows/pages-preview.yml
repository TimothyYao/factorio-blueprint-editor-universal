name: PR preview

# Builds a per-PR preview (app code only — the pack data comes from the shared
# data plane via VITE_DATA_URL, same as production) and publishes it to
# `pr-preview/pr-<N>/` on the `gh-pages` branch, then comments the URL on the PR.
# On close, the preview is removed. PUBLIC_BASE is /<this-repo>/pr-preview/… so
# this fork's site (factorio-blueprint-editor-universal) does not inherit the
# parent path. See docs/github-pages.md.

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]

concurrency:
  group: gh-pages-deploy
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        if: github.event.action != 'closed'
        with:
          node-version: 22

      - run: npm install --legacy-peer-deps
        if: github.event.action != 'closed'

      - run: npm run build:website
        if: github.event.action != 'closed'
        env:
          PUBLIC_BASE: /${{ github.event.repository.name }}/pr-preview/pr-${{ github.event.number }}/
          # Same pack data as production: the dedicated data plane, served
          # cross-origin with `Access-Control-Allow-Origin: *`. The editor
          # appends the active pack id at runtime, so a preview fetches
          # <root>/<pack>/data.json + that pack's atlas. Nothing pack-related is
          # bundled into the preview. See
          # https://github.com/TimothyYao/factorio-pack-data.
          VITE_DATA_URL: https://timothyyao.github.io/factorio-pack-data
          # Firebase web config for the blueprint library's cloud sync (Phase 6).
          # GitHub repo *variables*, not secrets — Firebase web config is public
          # (it ships in the client bundle). Unset ⇒ empty ⇒ unconfigured ⇒ a
          # local-only preview with no sign-in UI. See
          # packages/website/src/library/firebase.ts.
          VITE_FIREBASE_API_KEY: ${{ vars.VITE_FIREBASE_API_KEY }}
          VITE_FIREBASE_AUTH_DOMAIN: ${{ vars.VITE_FIREBASE_AUTH_DOMAIN }}
          VITE_FIREBASE_PROJECT_ID: ${{ vars.VITE_FIREBASE_PROJECT_ID }}
          VITE_FIREBASE_APP_ID: ${{ vars.VITE_FIREBASE_APP_ID }}

      - name: Deploy / remove preview
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: packages/website/dist
          umbrella-dir: pr-preview
